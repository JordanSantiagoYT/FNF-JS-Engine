name: Diag (temporary)

on:
  workflow_dispatch:
  push:
    branches: [arena/68e4e694-fnf-phoenix-engine]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
      - name: Install deps and typecheck
        shell: bash
        run: |
          set +e
          {
            haxelib setup "$GITHUB_WORKSPACE/.haxelib"
            chmod +x ./setup/unix.sh
            SKIP_SYSTEM_DEPENDENCIES=1 ./setup/unix.sh
            echo "=== BUILD NEKO ==="
            timeout 600 haxelib run lime build neko -D official 2>&1
            echo "NEKO_EXIT=$?"
            echo "=== BUILD LINUX (first stage) ==="
            timeout 600 haxelib run lime build linux -D official 2>&1
            echo "LINUX_EXIT=$?"
          } > diag.log 2>&1
          tail -n 200 diag.log
      - name: Post log tail to PR 61
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'diag log missing';
            try { body = fs.readFileSync('diag.log', 'utf8'); } catch (e) {}
            const tail = body.slice(-7000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 61,
              body: 'Temporary diagnostic log tail:\n\n```\n' + tail + '\n```',
            });

name: Build

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string
        default: ""

      buildWindows:
        description: "Build Windows"
        required: false
        type: boolean
        default: true

      buildAndroid:
        description: "Build Android"
        required: false
        type: boolean
        default: true

      buildLinux:
        description: "Build Linux"
        required: false
        type: boolean
        default: false

      buildMacOS:
        description: "Build macOS"
        required: false
        type: boolean
        default: false

      buildHTML5:
        description: "Build HTML5"
        required: false
        type: boolean
        default: false

      buildNeko:
        description: "Build Neko"
        required: false
        type: boolean
        default: false

      buildFlash:
        description: "Build Flash"
        required: false
        type: boolean
        default: false

      buildAIR:
        description: "Build AIR"
        required: false
        type: boolean
        default: false

      buildAllTargets:
        description: "Build all targets"
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      buildWindows:
        description: "Build Windows"
        required: false
        type: boolean
        default: true

      buildAndroid:
        description: "Build Android"
        required: false
        type: boolean
        default: true

      buildLinux:
        description: "Build Linux"
        required: false
        type: boolean
        default: false

      buildMacOS:
        description: "Build macOS"
        required: false
        type: boolean
        default: false

      buildHTML5:
        description: "Build HTML5"
        required: false
        type: boolean
        default: false

      buildNeko:
        description: "Build Neko"
        required: false
        type: boolean
        default: false

      buildFlash:
        description: "Build Flash"
        required: false
        type: boolean
        default: false

      buildAIR:
        description: "Build AIR"
        required: false
        type: boolean
        default: false

      buildAllTargets:
        description: "Build all targets"
        required: false
        type: boolean
        default: false

# Keep the haxelib installation inside the workspace so it can be restored on
# subsequent runs instead of downloading and compiling dependencies every time.
env:
  # Single source of truth for the compiler version (#60); mobile.yml uses
  # the same value and the regression tests assert the two cannot drift.
  HAXE_VERSION: "4.3.7"
  HAXELIB_PATH: ${{ github.workspace }}/.haxelib

  # Must be named HXCPP_COMPILE_CACHE - that's the variable hxcpp itself reads
  # to enable its object cache.
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache

  # Desktop hxcpp performance optimization. Android NDK's LTO link does not
  # resolve hxcpp's TLS runtime helper (__tls_get_addr), so it must not use it.
  HXCPP_DESKTOP_PERF_FLAGS: "-D HXCPP_OPTIMIZE_LINK"

# Cancel previous runs for the same branch/PR concurrency:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # =========================
          # Windows
          # =========================
          - name: Windows
            os: windows-latest
            target: windows
            target_dir: windows
            cache_name: windows
            artifact: windowsBuild
            artifact_path: build/release/windows/bin
            setup: windows

          # =========================
          # Android
          # =========================
          - name: Android
            os: ubuntu-24.04
            target: android
            target_dir: android
            cache_name: android
            artifact: androidBuild
            # This lime fork runs Gradle `assembleRelease` only when a keystore is
            # configured (see lime's AndroidHelper). CI has no keystore, so the APK
            # lands in the `debug` flavor folder even though the build config is
            # release (output dir is still build/release/...).
            artifact_path: build/release/android/bin/app/build/outputs/apk/debug
            setup: android

          # =========================
          # Linux
          # =========================
          - name: Linux
            os: ubuntu-latest
            target: linux
            target_dir: linux
            cache_name: linux
            artifact: linuxBuild
            artifact_path: build/release/linux/bin
            setup: unix

          # =========================
          # macOS Intel
          # =========================
          - name: macOS (Intel)
            os: macos-15
            target: mac
            target_dir: macos
            target_args: -64 -D HXCPP_M64
            cache_name: macos-intel
            artifact: macBuild-intel
            artifact_path: build/release/macos/bin
            setup: unix

          # =========================
          # macOS ARM
          # =========================
          - name: macOS (ARM)
            os: macos-15
            target: mac
            target_dir: macos
            target_args: -arm64 -D HXCPP_ARM64
            cache_name: macos-arm
            artifact: macBuild-arm
            artifact_path: build/release/macos/bin
            setup: unix

          # =========================
          # HTML5
          # =========================
          - name: HTML5
            os: ubuntu-latest
            target: html5
            target_dir: html5
            cache_name: html5
            artifact: html5Build
            artifact_path: build/release/html5/bin
            setup: unix

          # =========================
          # Neko
          # =========================
          - name: Neko
            os: ubuntu-latest
            target: neko
            target_dir: neko
            cache_name: neko
            artifact: nekoBuild
            artifact_path: build/release/neko/bin
            setup: unix

          # =========================
          # Flash
          # =========================
          - name: Flash
            os: ubuntu-latest
            target: flash
            target_dir: flash
            cache_name: flash
            artifact: flashBuild
            artifact_path: build/release/flash/bin
            target_args: -D disable-version-check
            setup: unix

          # =========================
          # HashLink (disabled)
          # =========================
          - name: HashLink
            os: ubuntu-latest
            target: hl
            target_dir: hl
            cache_name: hl
            artifact: hlBuild
            artifact_path: build/release/hl/bin
            setup: unix
            disabled: true

          # =========================
          # AIR
          # =========================
          - name: AIR
            os: ubuntu-latest
            target: air
            target_dir: air
            cache_name: air
            artifact: airBuild
            artifact_path: build/release/air/bin
            target_args: -D disable-version-check
            setup: unix

    steps:
      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # Determine whether this target is enabled
      # ==========================================
      - name: Check target selection
        id: target-selection
        shell: bash
        run: |
          # Explicitly disabled targets never build (experimental targets tracked for future enablement)
          if [ "${{ matrix.disabled }}" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Target ${{ matrix.name }} is disabled (experimental)."
            exit 0
          fi

          BUILD_ALL="${{ inputs.buildAllTargets }}"
          BUILD_WINDOWS="${{ inputs.buildWindows }}"
          BUILD_ANDROID="${{ inputs.buildAndroid }}"
          BUILD_LINUX="${{ inputs.buildLinux }}"
          BUILD_MACOS="${{ inputs.buildMacOS }}"
          BUILD_HTML5="${{ inputs.buildHTML5 }}"
          BUILD_NEKO="${{ inputs.buildNeko }}"
          BUILD_FLASH="${{ inputs.buildFlash }}"
          BUILD_AIR="${{ inputs.buildAIR }}"

          # Push / pull_request events don't provide workflow_dispatch inputs.
          # For those events, default to Windows + Android.
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            BUILD_WINDOWS="true"
            BUILD_ANDROID="true"
            BUILD_LINUX="false"
            BUILD_MACOS="false"
            BUILD_HTML5="false"
            BUILD_NEKO="false"
            BUILD_FLASH="false"
            BUILD_AIR="false"
          fi

          if [ "$BUILD_ALL" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Build all targets enabled."
            exit 0
          fi

          case "${{ matrix.target }}" in
            windows)
              ENABLED="$BUILD_WINDOWS"
              ;;
            android)
              ENABLED="$BUILD_ANDROID"
              ;;
            linux)
              ENABLED="$BUILD_LINUX"
              ;;
            mac)
              ENABLED="$BUILD_MACOS"
              ;;
            html5)
              ENABLED="$BUILD_HTML5"
              ;;
            neko)
              ENABLED="$BUILD_NEKO"
              ;;
            flash)
              ENABLED="$BUILD_FLASH"
              ;;
            air)
              ENABLED="$BUILD_AIR"
              ;;
            *)
              ENABLED="false"
              ;;
          esac

          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

          if [ "$ENABLED" = "true" ]; then
            echo "Target ${{ matrix.name }} is enabled."
          else
            echo "Target ${{ matrix.name }} is disabled."
          fi

      # ==========================================
      # Skip step for non-selected targets
      # ==========================================
      - name: Skip ${{ matrix.name }} (not selected)
        if: steps.target-selection.outputs.enabled != 'true'
        run: echo "⊘ Skipped (target not selected for this build)"
        continue-on-error: true

      # ==========================================
      # Haxe
      # ==========================================
      - uses: krdlab/setup-haxe@master
        if: steps.target-selection.outputs.enabled == 'true'
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      # ==========================================
      # Java 17 - Android
      # ==========================================
      - name: Setup Java 17
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # Android SDK / NDK
      # ==========================================
      - name: Setup Android SDK & NDK
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973

      # ==========================================
      # Linux packages
      # ==========================================
      - name: Install Linux packages
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libgl-dev \
            libx11-dev \
            libxi-dev \
            libxpm-dev \
            libxrandr-dev \
            libncurses-dev \
            libvlc-dev \
            libvlccore-dev

      # ==========================================
      # Restore Haxelib cache
      # ==========================================
      - name: Restore haxelib and hxcpp tools
        id: haxelib-cache
        if: steps.target-selection.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HAXELIB_PATH }}
          key: haxelib-${{ runner.os }}-${{ matrix.setup }}-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json') }}

      # ==========================================
      # Install Haxelib dependencies - Unix
      # ==========================================
      - name: Install haxelib dependencies (Unix)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'unix' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          haxelib setup "$HAXELIB_PATH"
          chmod +x ./setup/unix.sh
          SKIP_SYSTEM_DEPENDENCIES=1 ./setup/unix.sh

      # ==========================================
      # Install Haxelib dependencies - Android
      # ==========================================
      - name: Install haxelib dependencies (Android)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'android' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          haxelib setup "$HAXELIB_PATH"
          chmod +x ./setup/unix.sh
          SKIP_SYSTEM_DEPENDENCIES=1 ./setup/unix.sh

      # ==========================================
      # Install Haxelib dependencies - Windows
      # ==========================================
      - name: Install haxelib dependencies (Windows)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'windows' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          haxelib setup "%HAXELIB_PATH%"
          call setup\windows.bat

      # ==========================================
      # Android configuration
      # ==========================================
      - name: Configure Android
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          android_sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$android_sdk"

          haxelib run lime config ANDROID_SDK "$android_sdk"
          haxelib run lime config ANDROID_NDK_ROOT "$android_sdk/ndk/27.0.12077973"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      # ==========================================
      # Windows MSVC fix
      # ==========================================
      - name: Ensure MSVC hxcpp git checkout (Windows)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File setup\windows-msvc-fix.ps1

      # ==========================================
      # Compile hxcpp tools - Unix
      # ==========================================
      - name: Compile hxcpp tools (Unix)
        if: steps.target-selection.outputs.enabled == 'true' && (matrix.setup == 'unix' || matrix.setup == 'android') && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "$HAXELIB_PATH/hxcpp/git/tools/run"
          haxe compile.hxml

          cd "$HAXELIB_PATH/hxcpp/git/tools/hxcpp"
          haxe compile.hxml

      # ==========================================
      # Compile hxcpp tools - Windows
      # ==========================================
      - name: Compile hxcpp tools (Windows)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'windows' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "%HAXELIB_PATH%\hxcpp\git\tools\run"
          haxe compile.hxml

          cd /d "%HAXELIB_PATH%\hxcpp\git\tools\hxcpp"
          haxe compile.hxml

      # ==========================================
      # AIR SDK
      # ==========================================
      # Manual download chosen over air-sdk-setup-action: the action does not
      # exist at the expected public path, so a known-good zip URL is used instead.
      # The zip is extracted to RUNNER_TEMP so it is available to the compile step.
      # AIR_SDK is written to GITHUB_ENV so subsequent steps can reference it via
      # the standard ${{ env.AIR_SDK }} syntax.
      - name: Download AIR SDK
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'air'
        shell: bash
        run: |
          AIR_SDK_URL="https://airsdk.adobe.com/air/compiler/air/air-sdk.zip"
          AIR_SDK_DIR="$RUNNER_TEMP/air-sdk"
          mkdir -p "$AIR_SDK_DIR"
          curl -sL "$AIR_SDK_URL" -o "$AIR_SDK_DIR/air-sdk.zip"
          unzip -q "$AIR_SDK_DIR/air-sdk.zip" -d "$AIR_SDK_DIR"
          echo "AIR_SDK=$AIR_SDK_DIR" >> "$GITHUB_ENV"
          echo "Installed AIR SDK to $AIR_SDK_DIR"

      # ==========================================
      # Report resolved dependency revisions (#57)
      # ==========================================
      - name: Report resolved dependency revisions
        if: steps.target-selection.outputs.enabled == 'true'
        shell: bash
        run: |
          for checkout in "$HAXELIB_PATH"/*/git; do
            [ -d "$checkout/.git" ] || continue
            echo "$(basename "$(dirname "$checkout")") $(git -C "$checkout" rev-parse HEAD 2>/dev/null || echo unknown)"
          done

      # ==========================================
      # Save haxelib cache
      # ==========================================
      - name: Save haxelib and hxcpp tools
        if: success() && steps.target-selection.outputs.enabled == 'true' && steps.haxelib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HAXELIB_PATH }}
          key: ${{ steps.haxelib-cache.outputs.cache-primary-key }}

      # ==========================================
      # Restore generated C++ cache
      # ==========================================
      - name: Restore generated C++ cache
        id: build-cache
        if: steps.target-selection.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/release/${{ matrix.target_dir }}/haxe
            build/release/${{ matrix.target_dir }}/obj
            ${{ env.HXCPP_COMPILE_CACHE }}
          key: hxcpp-${{ runner.os }}-${{ matrix.cache_name }}-${{ inputs.buildFlags || 'commit' }}-${{ hashFiles('project.hxp', 'source/**') }}
          restore-keys: |
            hxcpp-${{ runner.os }}-${{ matrix.cache_name }}-${{ inputs.buildFlags || 'commit' }}-
            hxcpp-${{ runner.os }}-${{ matrix.cache_name }}-

      # ==========================================
      # Compile Unix / Linux / macOS
      # ==========================================
      - name: Compile (Unix)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'unix'
        shell: bash
        env:
          HXCPP_COMPILE_THREADS: 4
        run: |
          rm -f assets/preload/gameRenders/renderlol.bat

          rm -rf "$HXCPP_COMPILE_CACHE" 2>/dev/null || true

          haxelib run lime build ${{ matrix.target }} ${{ matrix.target_args }} -D"${{ inputs.buildFlags || 'commit' }}" ${{ env.HXCPP_DESKTOP_PERF_FLAGS }} ${AIR_SDK:+-DAIR_SDK=$AIR_SDK}

      # ==========================================
      # Compile Windows
      # ==========================================
      - name: Compile (Windows)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'windows'
        shell: pwsh
        # Limiting parallel C++ compilation keeps Windows runners below their memory limit.
        env:
          HXCPP_COMPILE_THREADS: 4
        run: |
          if (Test-Path $env:HXCPP_COMPILE_CACHE) {
            Remove-Item $env:HXCPP_COMPILE_CACHE -Recurse -Force
          }

          Remove-Item -Force assets/preload/gameRenders/renderlinux.sh

          haxelib run lime build windows -D"${{ inputs.buildFlags || 'commit' }}" ${{ env.HXCPP_DESKTOP_PERF_FLAGS }}

      # ==========================================
      # Compile Android
      # ==========================================
      - name: Compile (Android)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        env:
          HXCPP_COMPILE_THREADS: 4
        run: |
          rm -rf "$HXCPP_COMPILE_CACHE" 2>/dev/null || true

          haxelib run lime build android ${{ inputs.buildFlags != '' && format('-D {0}', inputs.buildFlags) || '' }}

      # ==========================================
      # Verify the actual merged Android manifest
      # ==========================================
      - name: Verify Android SAF manifest and SDK levels
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          set -euo pipefail
          app_dir="build/release/android/bin/app"
          merged_manifest=$(find "$app_dir/build/intermediates" -type f -name AndroidManifest.xml \
            \( -path '*/merged_manifest/*' -o -path '*/merged_manifests/*' \) \
            -path '*/debug/*' -print -quit)
          if [ -z "$merged_manifest" ]; then
            echo "::error::Could not find the merged debug AndroidManifest.xml under $app_dir/build/intermediates"
            find "$app_dir/build/intermediates" -type f -name AndroidManifest.xml -print
            exit 1
          fi
          python3 tools/check_android_documents_manifest.py "$merged_manifest" \
            --provider present --minimum-sdk 21 --target-sdk 36

      # ==========================================
      # Verify the APK ships the NDK C++ runtime
      # ==========================================
      # liblime.so is linked against the shared C++ runtime, so the APK must
      # contain lib/<abi>/libc++_shared.so next to it or the app dies on launch
      # with "dlopen failed: library libc++_shared.so not found".
      - name: Verify Android APK native libs
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          set -euo pipefail

          apk=$(ls build/release/android/bin/app/build/outputs/apk/*/*.apk | head -n 1)
          echo "Checking native libraries in $apk"

          entries=$(unzip -Z1 "$apk" | grep -E '^lib/[^/]+/[^/]+$' || true)
          echo "$entries"

          if [ -z "$entries" ]; then
            echo "::error::$apk contains no native libraries at all"
            exit 1
          fi

          missing=0
          for abi in $(printf '%s\n' "$entries" | cut -d/ -f2 | sort -u); do
            if ! printf '%s\n' "$entries" | grep -qxF "lib/$abi/libc++_shared.so"; then
              echo "::error::$apk is missing lib/$abi/libc++_shared.so, so liblime.so cannot be loaded at runtime"
              missing=1
            fi
          done

          [ "$missing" -eq 0 ]

      # ==========================================
      # Save generated C++ cache
      # ==========================================
      - name: Save generated C++ cache
        if: success() && steps.target-selection.outputs.enabled == 'true' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/release/${{ matrix.target_dir }}/haxe
            build/release/${{ matrix.target_dir }}/obj
            ${{ env.HXCPP_COMPILE_CACHE }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      # ==========================================
      # Publish artifact
      # ==========================================
      - name: Publish artifact
        if: steps.target-selection.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

name: Checks

# Fast regression guards for the Arena audit fixes (#42-#55, #57-#60).
# These need no Haxe or Android SDK; Java 17 exercises the Android-free
# production SAF path-policy and Media3 bridge lifecycle/action classes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency manifests agree and are pinned
        run: python3 tools/check_dependencies.py

      - name: Setup Java 17 for host-JVM regression tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

name: Mobile

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      buildAndroid:
        description: "Build Android"
        required: false
        type: boolean
        default: true

      buildIOS:
        description: "Build iOS"
        required: false
        type: boolean
        default: false

      buildAllTargets:
        description: "Build all mobile targets"
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string
        default: ""

      buildAndroid:
        description: "Build Android"
        required: false
        type: boolean
        default: true

      buildIOS:
        description: "Build iOS"
        required: false
        type: boolean
        default: false

      buildAllTargets:
        description: "Build all mobile targets"
        required: false
        type: boolean
        default: false


env:
  # Keep in sync with main.yml (#60); tests/test_arena_fixes.py enforces this.
  HAXE_VERSION: "4.3.7"
  # Keep the haxelib installation inside the workspace so the hxcpp tools
  # (which must be compiled from source) land in a known, writable location.
  HAXELIB_PATH: ${{ github.workspace }}/.haxelib

jobs:
  Mobile:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-24.04
            target: android

          - os: macos-latest
            target: ios

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Check whether this target is enabled
      # ==========================================
      - name: Check target selection
        id: target-selection
        shell: bash
        run: |
          BUILD_ANDROID="${{ inputs.buildAndroid }}"
          BUILD_IOS="${{ inputs.buildIOS }}"
          BUILD_ALL="${{ inputs.buildAllTargets }}"

          # Push events don't have workflow_dispatch inputs.
          # Default to Android for normal pushes.
          if [ "${{ github.event_name }}" = "push" ]; then
            BUILD_ANDROID="true"
            BUILD_IOS="false"
            BUILD_ALL="false"
          fi

          if [ "$BUILD_ALL" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "All mobile targets enabled."
            exit 0
          fi

          case "${{ matrix.target }}" in
            android)
              ENABLED="$BUILD_ANDROID"
              ;;
            ios)
              ENABLED="$BUILD_IOS"
              ;;
            *)
              ENABLED="false"
              ;;
          esac

          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

          if [ "$ENABLED" = "true" ]; then
            echo "Target ${{ matrix.target }} is enabled."
          else
            echo "Target ${{ matrix.target }} is disabled."
          fi


      # ==========================================
      # Setup Haxe
      # ==========================================
      - name: Setup Haxe
        if: steps.target-selection.outputs.enabled == 'true'
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}


      # ==========================================
      # Setup Java 17
      # ==========================================
      - name: Setup Java 17
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # Setup Android SDK & NDK
      # ==========================================
      - name: Setup Android SDK & NDK
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973


      # ==========================================
      # Ensure haxelib
      # ==========================================
      - name: Ensure haxelib and show diagnostics
        if: steps.target-selection.outputs.enabled == 'true'
        shell: bash
        run: |
          set -eux

          echo "PATH=$PATH"

          haxe --version || true

          if ! command -v haxelib >/dev/null 2>&1; then
            echo "ERROR: haxelib not found in PATH"
            exit 1
          fi

          haxelib --version || true

          haxelib selfupdate || true


      # ==========================================
      # Install Haxe libraries
      # ==========================================
      # Same installation path as main.yml (#42): setup/unix.sh installs the
      # commit pins recorded in hmm.json (tools/check_dependencies.py keeps
      # the two in sync). Failures are no longer swallowed with `|| true`.
      - name: Install Haxe libraries
        if: steps.target-selection.outputs.enabled == 'true'
        shell: bash
        run: |
          set -eux
          haxelib setup "$HAXELIB_PATH"
          chmod +x ./setup/unix.sh
          SKIP_SYSTEM_DEPENDENCIES=1 ./setup/unix.sh


      # ==========================================
      # Compile hxcpp tools
      # ==========================================
      # The FunkinCrew hxcpp checkout installed above is a source/development
      # version, so its command-line tools must be built before `lime build`
      # can drive the C++ compiler (otherwise hxcpp prompts interactively and
      # the build aborts with "Can't continue without hxcpp.n").
      - name: Compile hxcpp tools
        if: steps.target-selection.outputs.enabled == 'true'
        shell: bash
        run: |
          set -eux
          cd "$HAXELIB_PATH/hxcpp/git/tools/run"
          haxe compile.hxml

          cd "$HAXELIB_PATH/hxcpp/git/tools/hxcpp"
          haxe compile.hxml


      # ==========================================
      # Configure Android
      # ==========================================
      - name: Configure Android
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          set -eux

          android_sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$android_sdk"

          haxelib run lime config ANDROID_SDK "$android_sdk"
          haxelib run lime config ANDROID_NDK_ROOT "$android_sdk/ndk/27.0.12077973"

          haxelib run lime config JAVA_HOME "$JAVA_HOME"

          haxelib run lime config ANDROID_SETUP true


      # ==========================================
      # Compile Android
      # ==========================================
      - name: Compile (Android)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          set -eux

          if [ -n "${{ inputs.buildFlags }}" ]; then
            haxelib run lime build android \
              -D "${{ inputs.buildFlags }}"
          else
            haxelib run lime build android
          fi


      # ==========================================
      # Verify the actual merged Android manifest
      # ==========================================
      - name: Verify Android Media3/SAF manifest and SDK levels
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          set -euo pipefail
          app_dir="build/release/android/bin/app"
          merged_manifest=$(find "$app_dir/build/intermediates" -type f -name AndroidManifest.xml \
            \( -path '*/merged_manifest/*' -o -path '*/merged_manifests/*' \) \
            -path '*/debug/*' -print -quit)
          if [ -z "$merged_manifest" ]; then
            echo "::error::Could not find the merged debug AndroidManifest.xml under $app_dir/build/intermediates"
            find "$app_dir/build/intermediates" -type f -name AndroidManifest.xml -print
            exit 1
          fi
          python3 tools/check_android_documents_manifest.py "$merged_manifest" \
            --provider present --media-service present --minimum-sdk 21 --target-sdk 36

      # ==========================================
      # Verify the APK ships the NDK C++ runtime
      # ==========================================
      # liblime.so is linked against the shared C++ runtime, so the APK must
      # contain lib/<abi>/libc++_shared.so next to it or the app dies on launch
      # with "dlopen failed: library libc++_shared.so not found".
      - name: Verify Android APK native libs
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          set -euo pipefail

          apk=$(ls build/release/android/bin/app/build/outputs/apk/*/*.apk | head -n 1)
          echo "Checking native libraries in $apk"

          entries=$(unzip -Z1 "$apk" | grep -E '^lib/[^/]+/[^/]+$' || true)
          echo "$entries"

          if [ -z "$entries" ]; then
            echo "::error::$apk contains no native libraries at all"
            exit 1
          fi

          missing=0
          for abi in $(printf '%s\n' "$entries" | cut -d/ -f2 | sort -u); do
            if ! printf '%s\n' "$entries" | grep -qxF "lib/$abi/libc++_shared.so"; then
              echo "::error::$apk is missing lib/$abi/libc++_shared.so, so liblime.so cannot be loaded at runtime"
              missing=1
            fi
          done

          [ "$missing" -eq 0 ]


      # ==========================================
      # Compile iOS
      # ==========================================
      - name: Compile (iOS)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'ios'
        shell: bash
        run: |
          set -eux

          if [ -n "${{ inputs.buildFlags }}" ]; then
            haxelib run lime build ios \
              -nosign \
              -D "${{ inputs.buildFlags }}"
          else
            haxelib run lime build ios -nosign
          fi


      # ==========================================
      # Make IPA
      # ==========================================
      - name: Make IPA
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'ios'
        shell: bash
        run: |
          set -eux

          brew install ldid

          cd build/release/ios/build/Release-iphoneos/FNF-Phoenix-Engine.app

          ldid \
            -S../../../FNF-Phoenix-Engine/FNF-Phoenix-Engine.entitlements \
            FNF-Phoenix-Engine || true

          cd ..

          mkdir -p Payload

          mv FNF-Phoenix-Engine.app Payload

          zip -r FNF-Phoenix-Engine.ipa Payload


      # ==========================================
      # Upload Android artifact
      # ==========================================
      - name: Upload Artifact (Android)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          # `FNF-Phoenix-Engine-debug.apk`: this lime fork only runs Gradle
          # `assembleRelease` when a keystore is configured, and CI has none.
          path: build/release/android/bin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # ==========================================
      # Upload iOS artifact
      # ==========================================
      - name: Upload Artifact (iOS)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: iOSBuild
          path: |
            FNF-Phoenix-Engine.ipa
            build/release/ios/build/Release-iphoneos/*.ipa
          if-no-files-found: error

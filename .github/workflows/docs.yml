name: Documentation

# Builds the Docusaurus site in `website/` and publishes it to GitHub Pages.
# The Haxe code reference and the Lua/Python API pages are regenerated from
# `source/` during the build (see website/scripts/), so a doc comment change in
# the engine is enough to update the published site.

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "source/**"
      - "project.hxp"
      - "README.md"
      - "BUILDING.md"
      - "CODESTYLE.md"
      - "URI.MD"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - "source/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege by default: only the deploy job gets the Pages write scope.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # Catches content that builds fine but renders wrong (e.g. the legacy
      # `:::note Title` admonition syntax, which CommonMark shows as plain text).
      - name: Check markdown syntax
        working-directory: website
        run: npm run lint:docs

      - name: Build (regenerates the code reference)
        working-directory: website
        run: npm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Needs `pages: write`, hence it lives here and not in the build job.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

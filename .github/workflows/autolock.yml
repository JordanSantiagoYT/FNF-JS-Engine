name: Close inactive issues
on:
  schedule:
    - cron: "30 1 * * *"

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      # #48: actions/stale cannot label issues with a label that does not
      # exist, and it reported success anyway. Ensure it exists first.
      - name: Ensure stale label exists
        uses: actions/github-script@v7
        with:
          script: |
            const name = "stale";
            try {
              await github.rest.issues.getLabel({owner: context.repo.owner, repo: context.repo.repo, name});
            } catch (error) {
              if (error.status !== 404) throw error;
              core.warning(`Label "${name}" did not exist; creating it (#48).`);
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo, name,
                color: "FEF2C0", description: "Inactive for 30 days",
              });
            }
      - uses: actions/stale@v5
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: "This issue is stale because it has been open for 30 days with no activity."
          close-issue-message: "This issue was closed because it has been inactive for 7 days since being marked as stale."
          days-before-pr-stale: -1
          days-before-pr-close: -1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

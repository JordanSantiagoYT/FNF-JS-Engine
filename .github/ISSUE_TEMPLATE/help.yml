name: Help me!
description: If you need help using the engine.
labels: ["help wanted", "status: pending triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Describe your problem here."
    validations:
      required: true

  - type: textarea
    id: buildVersion
    attributes:
      label: "What version did the bug occur?"
      description: "You HAVE to answer this. If you don't know what version, please go to the main menu and look at the bottem-left of the window."
    validations:
      required: true

  - type: dropdown
    id: currentBuildCheck
    attributes:
      label: "Did you check if the problem occurs in the latest build?"
      description: "You don't need to answer this if this is happening on the latest version."
      options:
        - "No"
        - "Yes"
    validations:
      required: false

  - type: dropdown
    id: commitBuildCheck
    attributes:
      label: "Commit build or Release build?"
      options:
        - "Release build"
        - "Commit Build of latest version."
        - "Older commit build of the latest version."
    validations:
      required: true

  - type: dropdown
    id: knownIssueCheck
    attributes:
      label: "Did you check if there's a problem that you are trying to figure out on the issue linked below?"
      description: "[Search the Phoenix Engine issues first.](https://github.com/havaianasdestruido/FNF-Phoenix-Engine/issues?q=is%3Aissue+is%3Aopen)"
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: dropdown
    id: dupeCheck
    attributes:
      label: "Did you check if there's any similar issues?"
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: dropdown
    id: modding
    attributes:
      label: "Are you modding a build from source or with Lua?"
      options:
        - "I'm not modding (Base game issue)"
        - "Lua"
        - "Source"
        - "I'm not modding (Downloaded Modpack Issue)"
    validations:
      required: true

  - type: textarea
    id: cmdLogs
    attributes:
      label: "Command Prompt/Terminal logs/Crash logs (if existing)"
    validations:
      required: false

  - type: dropdown
    id: btarget
    attributes:
      label: "What is your build target?"
      options:
        - "Windows x64"
        - "Windows x86/x32"
        - "Linux"
        - "Mac"
        - "Mobile | Android"
        - "Mobile | iOS"
        - "Flash/Air-based target"
        - "Neko, HashLink, or other build system"
    validations:
      required: true

  - type: input
    id: buildsummary
    attributes:
      label: "Did you edit anything in this build? If so, mention or summarize your changes."
      placeholder: "Yes, I edited ClientPrefs.hx and tried to add a new setting"
    validations:
      required: false
